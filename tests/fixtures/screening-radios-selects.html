<!doctype html><html><head><meta charset="utf-8"><title>Application - screening questions</title></head><body>
<form onsubmit="return false">
  <div class="field"><label for="fn">First Name *</label><input id="fn" name="first_name" required></div>
  <div class="field"><label for="ln">Last Name *</label><input id="ln" name="last_name" required></div>
  <div class="field"><label for="em">Email *</label><input id="em" name="email" type="email" required></div>
  <fieldset><legend>Are you legally authorized to work in the United States? *</legend>
    <label><input type="radio" name="auth" value="Yes" required> Yes</label>
    <label><input type="radio" name="auth" value="No"> No</label></fieldset>
  <fieldset><legend>Will you now or in the future require sponsorship for employment visa status (e.g. H-1B)? *</legend>
    <label><input type="radio" name="spon" value="Yes" required> Yes</label>
    <label><input type="radio" name="spon" value="No"> No</label></fieldset>
  <div class="field"><label for="age">Are you at least 18 years of age? *</label>
    <select id="age" name="age" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="reloc">Are you willing to relocate? *</label>
    <select id="reloc" name="reloc" required><option value="">Select...</option><option value="yes">Yes</option><option value="no">No</option></select></div>
  <div class="field"><label for="ctry">Country *</label>
    <select id="ctry" name="country" required><option value="">Select...</option><option>Canada</option><option>Mexico</option><option>United Kingdom</option><option>United States</option></select></div>
  <div class="field"><label><input type="checkbox" name="consent" required> I agree to the privacy notice and consent to the processing of my data. *</label></div>
</form>
<script type="application/json" id="expect">{ "checks": [
  { "name": "First Name", "sel": "#fn", "value": "Alex" },
  { "name": "Last Name", "sel": "#ln", "value": "Rivera" },
  { "name": "Work authorization", "sel": "input[name=auth]", "picked": "Yes" },
  { "name": "Sponsorship", "sel": "input[name=spon]", "picked": "No" },
  { "name": "Over 18 (values 1/0)", "sel": "#age", "value": "1" },
  { "name": "Relocate", "sel": "#reloc", "value": "no" },
  { "name": "Country", "sel": "#ctry", "value": "United States" },
  { "name": "Privacy consent", "sel": "input[name=consent]", "checked": true }
] }</script>
</body></html>
